name: Build, Test & Publish (NPM + GitHub Packages)

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # The plugin resolves magpie's folders (XDG_*, the home folder) and its own
    # service on every platform, so the tests run on all three: a Windows or
    # macOS regression in path handling never showed up on ubuntu alone.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run Unit Tests
        run: node check.js

      - name: Verify the packed tarball ships no local data
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          npm pack --silent >/dev/null
          tar -tzf magpie-models-price-*.tgz > /tmp/pack-list.txt
          if grep -E 'settings\.json|plugins\.json|providers\.json|usage\.jsonl|\.env$' /tmp/pack-list.txt; then
            echo 'tarball must not carry user configuration'; exit 1
          fi
          if grep -E 'page/(models-data|generate-data)\.js' /tmp/pack-list.txt; then
            echo 'tarball must not carry a machine snapshot or its generator'; exit 1
          fi
          icon_count=$(grep -c '^package/page/icons/' /tmp/pack-list.txt || true)
          if [ "$icon_count" -gt 2 ]; then
            echo "tarball carries $icon_count page icons; only the ones the page draws may ship"; exit 1
          fi
          grep -q 'package/page/index.html' /tmp/pack-list.txt
          grep -q 'package/matcher.js' /tmp/pack-list.txt

  publish-npm:
    name: Publish to NPM
    needs: [build-and-test]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub Actions OIDC Trusted Publishing (免密钥发包)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure latest npm with OIDC Trusted Publishing support
        run: npm install -g npm@latest

      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          node -e '
            const pkg = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (pkg.version !== tag) {
              console.error(`tag ${tag} != package.json ${pkg.version}: npm never reuses a version, so a mismatch cannot be undone`);
              process.exit(1);
            }
          '
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Publish to NPM via Trusted Publishing (OIDC)
        run: |
          if [ -n "$CUSTOM_TOKEN" ]; then
            echo "Publishing with secret token..."
            NODE_AUTH_TOKEN="$CUSTOM_TOKEN" npm publish --provenance --access public
          else
            echo "Publishing via OIDC Trusted Publishing (Zero Secrets)..."
            npm publish --provenance --access public
          fi
        env:
          CUSTOM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: [build-and-test]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Configure Scoped Package Name for GitHub Packages
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const owner = process.env.GITHUB_REPOSITORY_OWNER.toLowerCase();
            if (!pkg.name.startsWith("@")) {
              pkg.name = `@${owner}/${pkg.name}`;
            }
            pkg.publishConfig = {
              registry: "https://npm.pkg.github.com"
            };
            if (!pkg.repository) {
              pkg.repository = {
                type: "git",
                url: `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`
              };
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("Publishing to GitHub Packages as:", pkg.name);
          '

      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
