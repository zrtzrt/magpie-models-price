<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="760" height="760" viewBox="-38 0 760 760"
     role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">3DRoomDesign.ai logo</title>
  <desc id="logo-desc">The 3DRoomDesign.ai orange house mark surrounding a perspective room, wood floor, and yellow cube.</desc>

  <defs>
    <linearGradient id="frame" x1="64" y1="305" x2="623" y2="435" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f85a39"/>
      <stop offset="0.35" stop-color="#f9772f"/>
      <stop offset="0.67" stop-color="#f99b28"/>
      <stop offset="1" stop-color="#fabb31"/>
    </linearGradient>

    <linearGradient id="left-wall" x1="126" y1="270" x2="350" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbe0bd"/>
      <stop offset="0.7" stop-color="#fce1bd"/>
      <stop offset="1" stop-color="#f9ddb7"/>
    </linearGradient>

    <linearGradient id="right-wall" x1="343" y1="255" x2="561" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e7a16c"/>
      <stop offset="0.46" stop-color="#f4b77d"/>
      <stop offset="1" stop-color="#ffd9aa"/>
    </linearGradient>

    <linearGradient id="floor-top" x1="272" y1="378" x2="415" y2="648" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c97b3d"/>
      <stop offset="0.34" stop-color="#e69a4c"/>
      <stop offset="0.72" stop-color="#f2ad5b"/>
      <stop offset="1" stop-color="#ffc775"/>
    </linearGradient>

    <linearGradient id="floor-left-edge" x1="231" y1="613" x2="350" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcebd5"/>
      <stop offset="1" stop-color="#fff5e5"/>
    </linearGradient>

    <linearGradient id="floor-right-edge" x1="343" y1="665" x2="451" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dc8f4a"/>
      <stop offset="1" stop-color="#e99c50"/>
    </linearGradient>

    <linearGradient id="cube-top" x1="275" y1="455" x2="407" y2="493" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff06a"/>
      <stop offset="0.52" stop-color="#fce04e"/>
      <stop offset="1" stop-color="#f7d333"/>
    </linearGradient>

    <linearGradient id="cube-left" x1="275" y1="490" x2="350" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4b91a"/>
      <stop offset="1" stop-color="#e9a70a"/>
    </linearGradient>

    <linearGradient id="cube-right" x1="343" y1="505" x2="412" y2="552" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#df970a"/>
      <stop offset="1" stop-color="#efb307"/>
    </linearGradient>

    <radialGradient id="ground-shadow" cx="50%" cy="50%" rx="50%" ry="50%">
      <stop offset="0" stop-color="#71431f" stop-opacity=".15"/>
      <stop offset="0.55" stop-color="#71431f" stop-opacity=".07"/>
      <stop offset="1" stop-color="#71431f" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="floor-clip">
      <path d="M343 356 L480 421 C470 427 446 459 446 493 L446 604 L343 665 L246 609 L246 492 C246 475 230 438 220 432 Z"/>
    </clipPath>

    <mask id="left-wall-cutouts" x="-38" y="0" width="760" height="760" maskUnits="userSpaceOnUse">
      <rect x="-38" width="760" height="760" fill="#fff"/>
      <path fill="#000" d="M169 276 L217 247 L217 310 L169 340 Z"/>
      <path fill="#000" d="M227 241 L274 212 L274 276 L227 306 Z"/>
      <path fill="#000" d="M169 350 L217 321 L217 384 L169 414 Z"/>
      <path fill="#000" d="M227 316 L274 286 L274 351 L227 381 Z"/>
    </mask>

    <mask id="right-wall-cutout" x="-38" y="0" width="760" height="760" maskUnits="userSpaceOnUse">
      <rect x="-38" width="760" height="760" fill="#fff"/>
      <path fill="#000" d="M430 262 L491 299 L491 411 L430 376 Z"/>
    </mask>

    <mask id="frame-cutouts" x="-38" y="0" width="760" height="760" maskUnits="userSpaceOnUse">
      <rect x="-38" width="760" height="760" fill="#fff"/>

      <!-- Arial Rounded Bold outlines converted to paths; these black regions become transparent. -->
      <path fill="#000" stroke="#000" stroke-width="28" stroke-linejoin="round"
            transform="matrix(.0735 .0426 0 -.0907 96.7 551)"
            d="M561 885Q653 885 719.5 939Q786 993 786 1094Q786 1171 733 1226.5Q680 1282 590 1282Q529 1282 489.5 1265Q450 1248 427 1220Q404 1192 383.5 1148Q363 1104 346 1065Q336 1044 310 1032Q284 1020 250 1020Q210 1020 176.5 1052.5Q143 1085 143 1139Q143 1191 174.5 1248.5Q206 1306 266.5 1358Q327 1410 417 1441.5Q507 1473 618 1473Q715 1473 795 1446.5Q875 1420 934 1370Q993 1320 1023 1254Q1053 1188 1053 1112Q1053 1012 1009.5 940.5Q966 869 885 801Q963 759 1016.5 705Q1070 651 1097 585.5Q1124 520 1124 444Q1124 353 1087.5 268Q1051 183 980 116.5Q909 50 811.5 12.5Q714 -25 596 -25Q476 -25 381 18Q286 61 224.5 125.5Q163 190 131.5 259Q100 328 100 373Q100 431 137.5 466.5Q175 502 231 502Q259 502 285 485.5Q311 469 319 446Q371 307 430.5 239.5Q490 172 598 172Q660 172 717.5 202.5Q775 233 812.5 293Q850 353 850 432Q850 549 786 615.5Q722 682 608 682Q588 682 546 678Q504 674 492 674Q437 674 407 701.5Q377 729 377 778Q377 826 413 855.5Q449 885 520 885Z"/>

      <path fill="#000" fill-rule="nonzero"
            transform="matrix(.0694 -.0403 0 -.0873 488 614)"
            d="M344 1466H731Q882 1466 990 1438Q1098 1410 1186 1333Q1415 1137 1415 737Q1415 605 1392 496Q1369 387 1321 299.5Q1273 212 1198 143Q1139 90 1069 58Q999 26 918.5 13Q838 0 737 0H350Q269 0 228 24.5Q187 49 174.5 93.5Q162 138 162 209V1284Q162 1380 205 1423Q248 1466 344 1466ZM459 1231V236H684Q758 236 800 240Q842 244 887 260Q932 276 965 305Q1114 431 1114 739Q1114 956 1048.5 1064Q983 1172 887 1201.5Q791 1231 655 1231Z"/>
    </mask>

    <filter id="cube-shadow" x="-60%" y="-100%" width="220%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Soft cast shadow; the SVG canvas itself remains transparent. -->
  <ellipse cx="343" cy="705" rx="164" ry="43" fill="url(#ground-shadow)"/>

  <!-- Thickness below the wood platform. -->
  <path d="M246 609 L343 665 L343 726 L246 670 Z" fill="url(#floor-left-edge)"/>
  <path d="M343 665 L446 604 L446 666 L343 726 Z" fill="url(#floor-right-edge)"/>

  <!-- The two room walls. Window and doorway shapes are real transparency. -->
  <path d="M343 119 L132 246 Q129 249 129 260 L129 376 L220 432 L343 356 Z"
        fill="url(#left-wall)" mask="url(#left-wall-cutouts)"/>
  <path d="M343 119 L553 246 Q555 248 555 260 L555 376 L480 421 L343 356 Z"
        fill="url(#right-wall)" mask="url(#right-wall-cutout)"/>
  <path d="M343 120 L343 356" fill="none" stroke="#bd774b" stroke-width="1.3" opacity=".2"/>

  <!-- Wood floor. -->
  <path d="M343 356 L480 421 C470 427 446 459 446 493 L446 604 L343 665 L246 609 L246 492 C246 475 230 438 220 432 Z" fill="url(#floor-top)"/>

  <g clip-path="url(#floor-clip)" fill="none" stroke-linecap="round">
    <!-- Broad plank seams. -->
    <g stroke="#8f4e27" stroke-width="1.35" opacity=".18">
      <path d="M180 405 L475 585"/>
      <path d="M198 375 L495 555"/>
      <path d="M163 437 L460 618"/>
      <path d="M225 349 L511 524"/>
      <path d="M147 469 L443 650"/>
    </g>
    <g stroke="#7f421f" stroke-width="1" opacity=".14">
      <path d="M245 404 L213 547"/>
      <path d="M301 370 L259 618"/>
      <path d="M366 368 L329 657"/>
      <path d="M423 403 L392 635"/>
      <path d="M470 433 L445 574"/>
    </g>

    <!-- Irregular grain, intentionally simplified. -->
    <g stroke="#8d4e2a" stroke-width="1.25" opacity=".13">
      <path d="M205 428 C251 445 282 478 329 493 S408 529 463 553"/>
      <path d="M207 454 C255 470 281 503 333 520 S407 560 456 578"/>
      <path d="M217 487 C257 496 293 536 340 548 S405 584 449 599"/>
      <path d="M224 522 C268 536 292 560 342 578 S393 605 434 621"/>
      <path d="M237 564 C273 577 305 604 345 616 S390 640 412 649"/>
      <path d="M255 395 C288 412 314 421 346 441 S401 462 438 486"/>
    </g>
    <g stroke="#ffd18b" stroke-width="1.1" opacity=".28">
      <path d="M190 442 C247 461 274 491 327 509 S409 546 468 570"/>
      <path d="M219 510 C266 528 298 553 340 566 S399 599 441 613"/>
      <path d="M245 577 C281 592 307 614 347 628 S379 643 404 653"/>
    </g>
  </g>

  <!-- Main orange/yellow house frame and side panels. -->
  <path mask="url(#frame-cutouts)" fill="url(#frame)"
        d="M343 46
           C351 46 357 49 365 54
           L590 189
           C611 201 622 221 622 245
           L622 523
           C622 547 612 563 593 576
           L488 655
           C472 668 461 660 461 637
           L461 493
           C461 459 478 440 488 434
           L559 391
           C566 387 570 379 570 370
           L570 260
           C570 245 565 237 553 230
           L357 111
           C351 107 347 103 343 103
           C339 103 335 107 329 111
           L132 230
           C120 237 114 246 114 260
           L114 370
           C114 378 116 384 121 389
           L212 445
           C224 452 231 472 231 492
           L231 609
           C231 640 221 650 201 641
           L88 566
           C69 555 61 542 61 523
           L61 245
           C61 221 72 202 92 190
           L321 53
           C329 48 336 46 343 46 Z"/>

  <!-- Small warm edge caused by the recessed doorway. -->
  <path d="M419 255 L430 262 L430 376 L419 382 Z" fill="#f2c57e" opacity=".72"/>

  <!-- Cube shadow and cube. -->
  <ellipse cx="365" cy="566" rx="69" ry="25" transform="rotate(29 365 566)"
           fill="#73421e" opacity=".22" filter="url(#cube-shadow)" clip-path="url(#floor-clip)"/>
  <path d="M273 470 L343 428 L412 469 L343 511 Z" fill="url(#cube-top)"/>
  <path d="M273 470 L343 511 L343 580 L273 539 Z" fill="url(#cube-left)"/>
  <path d="M343 511 L412 469 L412 539 L343 580 Z" fill="url(#cube-right)"/>
</svg>
