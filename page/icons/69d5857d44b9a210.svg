<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- deeprelay icon: the three chevrons on the dark tile (#121418), per the
     logo spec (O1 "Tight"). Geometry mirrors ChevronMark in ChipLogo.tsx —
     tight crop 82x74 at origin (9,13), strokes 14, round caps/joins —
     scaled to 57% of the tile. STACKED, not blended: favicon renderers
     handle mix-blend-mode inconsistently, and a dropped screen() would
     collapse the overlaps unpredictably; plain draw order (cyan on top)
     is the stable rendering. Change the chevrons in ChipLogo.tsx first,
     then re-derive this. -->
<rect width="64" height="64" rx="14.1" fill="#121418"/>
<g transform="translate(9.74 9.76) scale(0.445)" fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
<polyline points="16,20 44,50 16,80" stroke="#EF4F6F"/>
<polyline points="36,20 64,50 36,80" stroke="#F6C343"/>
<polyline points="56,20 84,50 56,80" stroke="#4CC6F2"/>
</g>
</svg>
