<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">绝命毒师</title>
  <desc id="desc">青色元素周期表风格的“毒”字站点图标</desc>

  <defs>
    <linearGradient id="brand" x1="72" y1="48" x2="440" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5DD0E0"/>
      <stop offset="1" stop-color="#4AB8C8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#brand)"/>

  <g fill="#08161A" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="62" y="92" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="52" font-weight="700">51</text>
    <text x="256" y="338" text-anchor="middle" font-size="270" font-weight="900">毒</text>
    <text x="450" y="454" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="46" font-weight="700">Jm</text>
  </g>
</svg>
