<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magpie 模型价格自动匹配与同步器</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --badge-bg: rgba(56, 189, 248, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }

    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .title-group h1 { font-size: 24px; font-weight: 700; color: #fff; }
    .title-group p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .header-actions { display: flex; gap: 12px; }
    button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: #2d3748; border-color: #4b5563; }
    button.btn-primary {
      background: var(--primary);
      color: #0f172a;
      border: none;
      font-weight: 600;
    }
    button.btn-primary:hover { background: var(--primary-hover); }
    button.btn-success { background: var(--success); color: #064e3b; border: none; font-weight: 600; }
    button.btn-danger { background: var(--danger); color: #fff; border: none; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .stat-card .label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .stat-card .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
    .stat-card .value.warning { color: var(--warning); }
    .stat-card .value.success { color: var(--success); }
    .stat-card .value.primary { color: var(--primary); }

    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .tabs { display: flex; gap: 8px; }
    .tab-btn {
      padding: 6px 14px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
    }
    .tab-btn.active {
      background: #334155;
      color: #fff;
    }
    .search-box {
      flex: 1;
      max-width: 320px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    .search-box input:focus { outline: none; border-color: var(--primary); }

    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      background: #182234;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 14px 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .model-col .model-id { font-weight: 600; color: #fff; font-family: monospace; }
    .model-col .current-status { font-size: 12px; margin-top: 3px; }
    .status-unpriced { color: var(--warning); }
    .status-priced { color: var(--success); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-exact { background: rgba(52, 211, 153, 0.2); color: #34d399; }
    .badge-high { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .badge-medium { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }

    .price-inputs { display: flex; gap: 6px; align-items: center; }
    .price-input {
      width: 70px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
      text-align: right;
    }
    .price-input:focus { outline: none; border-color: var(--primary); }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
      display: none;
      z-index: 100;
    }
    .toast.show { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">
        <h1>Magpie 模型定价自动匹配</h1>
        <p>基于 models.dev 官方数据库智能识别未定价模型，一键生效至 Magpie 原版账单系统</p>
      </div>
      <div class="header-actions">
        <button id="btnRefresh">🔄 刷新扫描</button>
        <button id="btnBatchSync" class="btn-primary">⚡ 同步选中模型到 Magpie</button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">当前活跃模型总数</div>
        <div class="value primary" id="statTotal">-</div>
      </div>
      <div class="stat-card">
        <div class="label">未定价模型 (Unpriced)</div>
        <div class="value warning" id="statUnpriced">-</div>
      </div>
      <div class="stat-card">
        <div class="label">已智能匹配到官方定价</div>
        <div class="value success" id="statMatchable">-</div>
      </div>
    </div>

    <div class="control-bar">
      <div class="tabs">
        <button class="tab-btn active" data-tab="unpriced">待配置模型</button>
        <button class="tab-btn" data-tab="all">全部模型</button>
        <button class="tab-btn" data-tab="priced">已配置模型</button>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索模型名称或渠道...">
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th width="40"><input type="checkbox" id="selectAll" checked></th>
            <th>Magpie 渠道与模型</th>
            <th>models.dev 智能匹配项</th>
            <th>置信度</th>
            <th>单价设置 (USD / 1M tokens: In / Out / CR / CW)</th>
            <th width="100">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" style="text-align:center; padding: 40px; color: var(--text-muted);">正在扫描模型与解析 models.dev 数据...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let rawItems = [];
    let currentTab = 'unpriced';

    const $ = (id) => document.getElementById(id);

    function showToast(msg, isError = false) {
      const t = $('toast');
      t.textContent = msg;
      t.style.borderColor = isError ? 'var(--danger)' : 'var(--success)';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    async function loadData() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        $('statTotal').textContent = data.total;
        $('statUnpriced').textContent = data.unpricedCount;
        $('statMatchable').textContent = data.matchableCount;

        rawItems = data.items;
        renderTable();
      } catch (e) {
        showToast('加载失败: ' + e.message, true);
      }
    }

    function renderTable() {
      const query = $('searchInput').value.trim().toLowerCase();
      let filtered = rawItems;

      if (currentTab === 'unpriced') {
        filtered = filtered.filter(i => i.isUnpriced);
      } else if (currentTab === 'priced') {
        filtered = filtered.filter(i => !i.isUnpriced);
      }

      if (query) {
        filtered = filtered.filter(i => i.model.toLowerCase().includes(query) || (i.matched && i.matched.model.toLowerCase().includes(query)));
      }

      const tbody = $('tableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 30px; color: var(--text-muted);">没有符合条件的模型</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map((item, idx) => {
        const m = item.matched;
        const defaultIn = m ? m.cost.input : 0;
        const defaultOut = m ? m.cost.output : 0;
        const defaultCR = m ? m.cost.cache_read : 0;
        const defaultCW = m ? m.cost.cache_write : 0;

        const badgeClass = m ? ('badge-' + m.confidence) : '';
        const badgeLabel = m ? (m.confidence === 'exact' ? '精确' : m.confidence === 'high' ? '高' : '模糊') : '无匹配';

        return `
          <tr data-model="${item.model}">
            <td><input type="checkbox" class="row-checkbox" value="${item.model}" ${item.isUnpriced && m ? 'checked' : ''}></td>
            <td class="model-col">
              <div class="model-id">${item.model}</div>
              <div class="current-status ${item.isUnpriced ? 'status-unpriced' : 'status-priced'}">${item.currentPrice}</div>
            </td>
            <td>
              ${m ? `<div><strong>${m.provider}</strong>/${m.model}</div><div style="font-size:12px;color:var(--text-muted)">${m.reason}</div>` : '<span style="color:var(--text-muted)">无匹配建议</span>'}
            </td>
            <td>
              <span class="badge ${badgeClass}">${badgeLabel}</span>
            </td>
            <td>
              <div class="price-inputs">
                <input class="price-input p-in" value="${defaultIn}" title="输入价格">
                <input class="price-input p-out" value="${defaultOut}" title="输出价格">
                <input class="price-input p-cr" value="${defaultCR}" title="缓存读取价格">
                <input class="price-input p-cw" value="${defaultCW}" title="缓存写入价格">
              </div>
            </td>
            <td>
              <button class="btn-single-sync" data-model="${item.model}">设置</button>
            </td>
          </tr>
        `;
      }).join('');

      attachEvents();
    }

    function attachEvents() {
      document.querySelectorAll('.btn-single-sync').forEach(btn => {
        btn.onclick = async () => {
          const model = btn.dataset.model;
          const tr = btn.closest('tr');
          const pIn = tr.querySelector('.p-in').value;
          const pOut = tr.querySelector('.p-out').value;
          const pCR = tr.querySelector('.p-cr').value;
          const pCW = tr.querySelector('.p-cw').value;
          const priceString = [pIn, pOut, pCR, pCW].join(',');

          btn.disabled = true;
          btn.textContent = '写入中...';
          try {
            const res = await fetch('/api/sync', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ items: [{ model, priceString }] })
            });
            const data = await res.json();
            if (data.success) {
              showToast(`成功设置 ${model} 价格！`);
              await loadData();
            } else {
              showToast('设置失败: ' + data.error, true);
            }
          } catch (e) {
            showToast('请求出错: ' + e.message, true);
          } finally {
            btn.disabled = false;
            btn.textContent = '设置';
          }
        };
      });
    }

    $('btnRefresh').onclick = loadData;
    $('searchInput').oninput = renderTable;

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        renderTable();
      };
    });

    $('selectAll').onchange = (e) => {
      document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = e.target.checked);
    };

    $('btnBatchSync').onclick = async () => {
      const selected = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => {
        const tr = cb.closest('tr');
        const model = cb.value;
        const pIn = tr.querySelector('.p-in').value;
        const pOut = tr.querySelector('.p-out').value;
        const pCR = tr.querySelector('.p-cr').value;
        const pCW = tr.querySelector('.p-cw').value;
        return { model, priceString: [pIn, pOut, pCR, pCW].join(',') };
      });

      if (selected.length === 0) {
        showToast('请至少勾选一个模型', true);
        return;
      }

      $('btnBatchSync').disabled = true;
      $('btnBatchSync').textContent = '同步处理中...';

      try {
        const res = await fetch('/api/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: selected })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`成功批量设置 ${selected.length} 个模型价格！`);
          await loadData();
        } else {
          showToast('同步失败: ' + data.error, true);
        }
      } catch (e) {
        showToast('请求出错: ' + e.message, true);
      } finally {
        $('btnBatchSync').disabled = false;
        $('btnBatchSync').textContent = '⚡ 同步选中模型到 Magpie';
      }
    };

    loadData();
  </script>
</body>
</html>
